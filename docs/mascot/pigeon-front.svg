<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <!-- 信鸽「咕咕」正脸 v3
       修正：尾羽从两侧偏后伸出（不再像腿）、头身之间加颈部过渡 -->

  <!-- 尾羽：从身体两侧中后部伸出，竖直向上收，像鸽子翘尾 -->
  <path d="M20 44 L 12 54 L 15 44.5 L 11 46 L 18 40 Z" fill="#7A93B8"/>
  <path d="M44 44 L 52 54 L 49 44.5 L 53 46 L 46 40 Z" fill="#7A93B8"/>

  <!-- 身体 -->
  <path d="M32 26
           C 21 26, 15.5 33, 15.5 41.5
           C 15.5 49, 22 54, 32 54
           C 42 54, 48.5 49, 48.5 41.5
           C 48.5 33, 43 26, 32 26 Z"
        fill="#8AA4C8"/>

  <!-- 颈部过渡：一小片稍亮的区域，替掉生硬的圆形切分 -->
  <path d="M24 24 C 27 29, 37 29, 40 24 C 37 30, 27 30, 24 24 Z"
        fill="#9DB5D4" opacity="0.5"/>

  <!-- 翅膀 -->
  <path d="M17 35
           C 14.5 41, 15.5 48.5, 20.5 52.5
           C 18.5 46.5, 19 39.5, 19 35 Z"
        fill="#9DB5D4"/>
  <path d="M47 35
           C 49.5 41, 48.5 48.5, 43.5 52.5
           C 45.5 46.5, 45 39.5, 45 35 Z"
        fill="#9DB5D4"/>

  <!-- 头 -->
  <path d="M32 5.5
           C 23.5 5.5, 18 11.5, 18 19.5
           C 18 26.5, 24 30.5, 32 30.5
           C 40 30.5, 46 26.5, 46 19.5
           C 46 11.5, 40.5 5.5, 32 5.5 Z"
        fill="#8AA4C8"/>

  <!-- 眼睛 -->
  <ellipse cx="26.6" cy="17.8" rx="2.3" ry="2.6" fill="#1C2B43"/>
  <ellipse cx="37.4" cy="17.8" rx="2.3" ry="2.6" fill="#1C2B43"/>
  <circle cx="27.3" cy="17.0" r="0.75" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="38.1" cy="17.0" r="0.75" fill="#FFFFFF" opacity="0.85"/>

  <!-- 喙 -->
  <path d="M32 20.8 L 34.3 24.6 L 29.7 24.6 Z" fill="#FF9600"/>

  <!-- 脚 -->
  <path d="M28.8 54 L 28.8 58.2" stroke="#FF9600" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M35.2 54 L 35.2 58.2" stroke="#FF9600" stroke-width="2.5" stroke-linecap="round"/>
</svg>
