name: Translation editor regression tests

on:
  pull_request:
    paths:
      - 'app/src/main/kotlin/dev/patrickgold/florisboard/ime/translation/TranslationRange.kt'
      - 'app/src/androidTest/kotlin/dev/patrickgold/florisboard/ime/translation/TranslationRangeTest.kt'

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: lukka/get-cmake@v4.0.2
      - name: Build app and instrumentation tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run translation tests against Android EditText
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.patrickgold.florisboard.ime.translation.TranslationRangeTest
